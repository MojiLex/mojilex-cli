name: Bug report
description: Report a reproducible, non-sensitive CLI defect
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not paste API keys, Telegram download URLs, private media, or security reports.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MojiLex version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, macOS, Other]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Redact all secrets and private source data.
    validations:
      required: true
