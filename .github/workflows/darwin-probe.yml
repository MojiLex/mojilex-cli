name: Darwin exact memory limit probe
on:
  push:
    branches: [codex/ci-darwin-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install Pillow
      - run: python tools/probe_darwin_limits.py
